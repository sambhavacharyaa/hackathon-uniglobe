{% extends "base.html" %}

{% block title %}Resend verification code{% endblock %}

{% block content %}
<div class="auth-card">
    <h1>Resend verification code</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-field">
            <label for="{{ form.email.id_for_label }}">{{ form.email.label }}</label>
            {{ form.email }}
            {% for error in form.email.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
        </div>
        <button type="submit" class="btn-primary">Send code</button>
    </form>
    <p class="auth-switch"><a href="{% url 'verify-otp' %}">Back to verification</a></p>
</div>
{% endblock %}
